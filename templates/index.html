<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6750A4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1B1F" media="(prefers-color-scheme: dark)">
    <title>Pi Camera — Today</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">

    <style>
        /* ---------- Material 3 design tokens (mirrors live.html) ---------- */
        :root {
            color-scheme: light dark;
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-tertiary: #7D5260;
            --md-sys-color-tertiary-container: #FFD8E4;
            --md-sys-color-on-tertiary-container: #31111D;
            --md-sys-color-error: #B3261E;
            --md-sys-color-error-container: #F9DEDC;
            --md-sys-color-on-error-container: #410E0B;
            --md-sys-color-success: #146C2E;
            --md-sys-color-success-container: #B8F0C2;
            --md-sys-color-on-success-container: #002106;
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E0E9;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;

            --md-sys-elevation-1: 0 1px 2px 0 rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
            --md-sys-elevation-2: 0 1px 2px 0 rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
            --md-sys-elevation-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px 0 rgba(0,0,0,.30);

            --md-sys-shape-xs: 4px;
            --md-sys-shape-sm: 8px;
            --md-sys-shape-md: 12px;
            --md-sys-shape-lg: 16px;
            --md-sys-shape-xl: 28px;
            --md-sys-shape-full: 999px;

            --md-sys-motion-standard: cubic-bezier(.2,0,0,1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-primary: #D0BCFF;
                --md-sys-color-on-primary: #381E72;
                --md-sys-color-primary-container: #4F378B;
                --md-sys-color-on-primary-container: #EADDFF;
                --md-sys-color-secondary-container: #4A4458;
                --md-sys-color-on-secondary-container: #E8DEF8;
                --md-sys-color-tertiary-container: #633B48;
                --md-sys-color-on-tertiary-container: #FFD8E4;
                --md-sys-color-error: #F2B8B5;
                --md-sys-color-error-container: #8C1D18;
                --md-sys-color-on-error-container: #F9DEDC;
                --md-sys-color-success: #7DD896;
                --md-sys-color-success-container: #00531A;
                --md-sys-color-on-success-container: #B8F0C2;
                --md-sys-color-background: #141218;
                --md-sys-color-on-background: #E6E0E9;
                --md-sys-color-surface: #141218;
                --md-sys-color-on-surface: #E6E0E9;
                --md-sys-color-on-surface-variant: #CAC4D0;
                --md-sys-color-surface-container-low: #1D1B20;
                --md-sys-color-surface-container: #211F26;
                --md-sys-color-surface-container-high: #2B2930;
                --md-sys-color-surface-container-highest: #36343B;
                --md-sys-color-outline: #938F99;
                --md-sys-color-outline-variant: #49454F;
            }
        }

        html[data-theme="light"] {
            color-scheme: light;
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-tertiary-container: #FFD8E4;
            --md-sys-color-on-tertiary-container: #31111D;
            --md-sys-color-error: #B3261E;
            --md-sys-color-error-container: #F9DEDC;
            --md-sys-color-on-error-container: #410E0B;
            --md-sys-color-success: #146C2E;
            --md-sys-color-success-container: #B8F0C2;
            --md-sys-color-on-success-container: #002106;
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E0E9;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-tertiary-container: #633B48;
            --md-sys-color-on-tertiary-container: #FFD8E4;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-error-container: #8C1D18;
            --md-sys-color-on-error-container: #F9DEDC;
            --md-sys-color-success: #7DD896;
            --md-sys-color-success-container: #00531A;
            --md-sys-color-on-success-container: #B8F0C2;
            --md-sys-color-background: #141218;
            --md-sys-color-on-background: #E6E0E9;
            --md-sys-color-surface: #141218;
            --md-sys-color-on-surface: #E6E0E9;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-surface-container-low: #1D1B20;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-highest: #36343B;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            font-family: 'Roboto Flex', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 200ms var(--md-sys-motion-standard),
                        color 200ms var(--md-sys-motion-standard);
        }
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
            line-height: 1;
        }

        /* ---------- Top App Bar ---------- */
        .top-app-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            backdrop-filter: blur(8px);
        }
        .top-app-bar .leading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--md-sys-shape-full);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }
        .top-app-bar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 500;
            flex: 1;
            line-height: 28px;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 96px;
            display: grid;
            gap: 16px;
        }

        .card {
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface);
            border-radius: var(--md-sys-shape-lg);
            padding: 16px;
        }
        .card.elevated {
            background: var(--md-sys-color-surface-container);
            box-shadow: var(--md-sys-elevation-1);
        }
        .card .title {
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ---------- Hero (latest photo) ---------- */
        .hero {
            padding: 0;
            overflow: hidden;
            position: relative;
            background: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-xl);
            box-shadow: var(--md-sys-elevation-2);
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }
        .hero .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            padding: 24px;
        }
        .hero .empty .material-symbols-rounded { font-size: 64px; }
        .hero-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            pointer-events: none;
            flex-wrap: wrap;
        }

        /* ---------- Chips ---------- */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--md-sys-shape-sm);
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            pointer-events: auto;
        }
        .chip[data-status="day"] {
            background: var(--md-sys-color-success-container);
            color: var(--md-sys-color-on-success-container);
            border-color: transparent;
        }
        .chip[data-status="night"] {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            border-color: transparent;
        }
        .chip[data-status="error"] {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border-color: transparent;
        }

        /* ---------- Sun strip ---------- */
        .sun-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
        }
        .sun-info .row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .sun-info .row .material-symbols-rounded { font-size: 18px; }
        .sun-info strong {
            color: var(--md-sys-color-on-surface);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* ---------- Gallery ---------- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .gallery a.tile {
            position: relative;
            aspect-ratio: 4 / 3;
            border-radius: var(--md-sys-shape-md);
            overflow: hidden;
            background: var(--md-sys-color-surface-container-highest);
            display: block;
            text-decoration: none;
            transition: transform 150ms var(--md-sys-motion-standard),
                        box-shadow 150ms var(--md-sys-motion-standard);
        }
        .gallery a.tile:hover {
            transform: translateY(-2px);
            box-shadow: var(--md-sys-elevation-2);
        }
        .gallery a.tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery a.tile .ts {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 6px 8px;
            font-size: 11px;
            color: #fff;
            background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0));
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        .gallery .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
            padding: 32px 16px;
        }

        /* ---------- Buttons ---------- */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 24px;
            border: none;
            border-radius: var(--md-sys-shape-full);
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 120ms var(--md-sys-motion-standard);
            pointer-events: none;
        }
        .btn:hover::before { opacity: .08; }
        .btn:active::before { opacity: .12; }
        .btn-tonal {
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .btn-filled {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--md-sys-shape-full);
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 120ms var(--md-sys-motion-standard);
        }
        .icon-btn:hover::before { opacity: .08; }
        .icon-btn:active::before { opacity: .12; }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ---------- Lightbox ---------- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--md-sys-shape-md);
        }
        .lightbox .close {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #fff;
            background: rgba(255, 255, 255, .12);
        }

        @media (max-width: 480px) {
            .top-app-bar h1 { font-size: 18px; }
            main { padding: 16px 12px 96px; }
            .actions { width: 100%; }
            .actions .btn { flex: 1; }
        }
    </style>
</head>
<body>
    <header class="top-app-bar">
        <span class="leading" aria-hidden="true">
            <span class="material-symbols-rounded">photo_library</span>
        </span>
        <h1>Pi Camera <span id="loc-name" style="opacity:.7;font-weight:400"></span></h1>
        <a href="/live" class="icon-btn" title="Live stream" aria-label="Live stream">
            <span class="material-symbols-rounded">videocam</span>
        </a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
            <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
        </button>
    </header>

    <main>
        <!-- Hero (latest photo) -->
        <section class="hero" id="hero" aria-label="Latest captured photo">
            <div class="empty" id="hero-empty">
                <span class="material-symbols-rounded">image_not_supported</span>
                <div>No photos captured yet today.</div>
            </div>
            <img id="hero-img" alt="Latest captured photo" style="display:none">
            <div class="hero-overlay">
                <span class="chip" id="sun-chip" data-status="unknown">
                    <span class="material-symbols-rounded" style="font-size:16px" id="sun-icon">wb_sunny</span>
                    <span id="sun-text">…</span>
                </span>
                <span class="chip" id="latest-chip" style="display:none">
                    <span class="material-symbols-rounded" style="font-size:16px">schedule</span>
                    <span id="latest-text">–</span>
                </span>
            </div>
        </section>

        <!-- Sun status / capture info -->
        <section class="card elevated" aria-label="Sun and capture info">
            <div class="title"><span class="material-symbols-rounded" style="font-size:18px">wb_twilight</span> Today</div>
            <div class="sun-info">
                <span class="row"><span class="material-symbols-rounded">wb_twilight</span> Sunrise <strong id="sunrise">–</strong></span>
                <span class="row"><span class="material-symbols-rounded">nights_stay</span> Sunset <strong id="sunset">–</strong></span>
                <span class="row"><span class="material-symbols-rounded">timer</span> Interval <strong id="interval">–</strong></span>
                <span class="row"><span class="material-symbols-rounded">photo_camera</span> Captures <strong id="count">–</strong></span>
            </div>
            <div class="actions" style="margin-top:14px">
                <a class="btn btn-tonal" href="/live">
                    <span class="material-symbols-rounded">videocam</span>
                    Live stream
                </a>
                <button class="btn btn-filled" id="refresh-btn" type="button">
                    <span class="material-symbols-rounded">refresh</span>
                    Refresh
                </button>
            </div>
        </section>

        <!-- Today's gallery -->
        <section class="card elevated" aria-label="Today's gallery">
            <div class="title"><span class="material-symbols-rounded" style="font-size:18px">collections</span> Today's captures</div>
            <div class="gallery" id="gallery">
                <div class="empty">Loading…</div>
            </div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="icon-btn close" id="lightbox-close" aria-label="Close">
            <span class="material-symbols-rounded">close</span>
        </button>
        <img id="lightbox-img" alt="">
    </div>

    <script>
        // ---------- Theme handling (mirrors live.html) ----------
        (function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') {
                document.documentElement.setAttribute('data-theme', stored);
            }
            updateThemeIcon();
        })();
        function currentTheme() {
            const explicit = document.documentElement.getAttribute('data-theme');
            if (explicit) return explicit;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            icon.textContent = currentTheme() === 'dark' ? 'light_mode' : 'dark_mode';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        // ---------- Helpers ----------
        function fmtTime(iso) {
            if (!iso) return '–';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '–';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function fmtTimeFull(iso) {
            if (!iso) return '–';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '–';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        function fmtInterval(seconds) {
            if (seconds == null) return '–';
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.round(seconds / 60)} min`;
            return `${(seconds / 3600).toFixed(1)} h`;
        }

        // ---------- Sun status ----------
        async function refreshSun() {
            try {
                const r = await fetch('/api/sun', { cache: 'no-store' });
                const d = await r.json();
                document.getElementById('sunrise').textContent = fmtTime(d.sunrise);
                document.getElementById('sunset').textContent = fmtTime(d.sunset);
                document.getElementById('interval').textContent = fmtInterval(d.interval_seconds);
                if (d.location && d.location.name) {
                    document.getElementById('loc-name').textContent = `· ${d.location.name}`;
                }
                const chip = document.getElementById('sun-chip');
                const txt = document.getElementById('sun-text');
                const icon = document.getElementById('sun-icon');
                if (d.is_daytime) {
                    chip.dataset.status = 'day';
                    icon.textContent = 'wb_sunny';
                    txt.textContent = `Daytime · capturing every ${fmtInterval(d.interval_seconds)}`;
                } else {
                    chip.dataset.status = 'night';
                    icon.textContent = 'bedtime';
                    txt.textContent = `Night · paused until ${fmtTime(d.next_sunrise)}`;
                }
            } catch (err) {
                const chip = document.getElementById('sun-chip');
                chip.dataset.status = 'error';
                document.getElementById('sun-text').textContent = 'Sun info unavailable';
            }
        }

        // ---------- Photos ----------
        async function refreshPhotos() {
            try {
                const r = await fetch('/api/photos', { cache: 'no-store' });
                const d = await r.json();
                const photos = d.photos || [];
                document.getElementById('count').textContent = photos.length;

                const heroImg = document.getElementById('hero-img');
                const heroEmpty = document.getElementById('hero-empty');
                const latestChip = document.getElementById('latest-chip');
                const latestText = document.getElementById('latest-text');

                if (photos.length === 0) {
                    heroImg.style.display = 'none';
                    heroEmpty.style.display = 'flex';
                    latestChip.style.display = 'none';
                } else {
                    const latest = photos[photos.length - 1];
                    heroImg.src = latest.url;
                    heroImg.style.display = 'block';
                    heroEmpty.style.display = 'none';
                    latestChip.style.display = 'inline-flex';
                    latestText.textContent = fmtTimeFull(latest.taken_at);
                }

                const gallery = document.getElementById('gallery');
                if (photos.length === 0) {
                    gallery.innerHTML = '<div class="empty">No captures yet today. Photos will appear here as they\u2019re taken between sunrise and sunset.</div>';
                } else {
                    // Newest first in the gallery.
                    const reversed = photos.slice().reverse();
                    gallery.innerHTML = reversed.map(p => `
                        <a class="tile" href="${p.url}" data-url="${p.url}" title="${fmtTimeFull(p.taken_at)}">
                            <img src="${p.url}" alt="Capture at ${fmtTimeFull(p.taken_at)}" loading="lazy">
                            <div class="ts">${fmtTime(p.taken_at)}</div>
                        </a>
                    `).join('');
                    // Wire up lightbox.
                    gallery.querySelectorAll('a.tile').forEach(a => {
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            openLightbox(a.dataset.url);
                        });
                    });
                }
            } catch (err) {
                document.getElementById('gallery').innerHTML =
                    '<div class="empty">Failed to load photos.</div>';
            }
        }

        // ---------- Lightbox ----------
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('show');
        }
        function closeLightbox() {
            lightbox.classList.remove('show');
            lightboxImg.src = '';
        }
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // ---------- Refresh loop ----------
        document.getElementById('refresh-btn').addEventListener('click', () => {
            refreshSun();
            refreshPhotos();
        });

        let pollTimer = null;
        function startPolling() {
            if (pollTimer != null) return;
            refreshSun();
            refreshPhotos();
            // Poll every 30s — captures are minutes apart, no need to hammer.
            pollTimer = setInterval(() => {
                refreshSun();
                refreshPhotos();
            }, 30000);
        }
        function stopPolling() {
            if (pollTimer == null) return;
            clearInterval(pollTimer);
            pollTimer = null;
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopPolling();
            else startPolling();
        });
        startPolling();
    </script>
</body>
</html>
